name: tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch Statamic releases that change the static caching internals.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        # The oldest Statamic the addon supports and the newest stable release.
        statamic: [6.0.0, latest]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          # Statamic 6.0.0 requires Laravel 12.
          - statamic: 6.0.0
            laravel: 13.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - Statamic ${{ matrix.statamic }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, gd, exif
          coverage: none

      - name: Pin Statamic 6.0.0
        if: matrix.statamic == '6.0.0'
        # Composer refuses Statamic releases with security advisories by
        # default, and 6.0.0 has some. Only this CI checkout is affected.
        run: |
          composer config audit.block-insecure false
          composer require "statamic/cms:6.0.0" --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Show Statamic version
        run: composer show statamic/cms | grep versions

      - name: PHPStan
        if: matrix.statamic == 'latest'
        run: composer analyse

      - name: Pint
        if: matrix.statamic == 'latest'
        run: composer lint:check

      - name: Tests
        run: composer test:unit
