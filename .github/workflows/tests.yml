name: tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch Statamic releases that change the static caching internals.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, gd, exif
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        if: matrix.stability == 'prefer-stable'
        run: composer analyse

      - name: Pint
        if: matrix.stability == 'prefer-stable'
        run: composer lint:check

      - name: Tests
        run: composer test:unit

  statamic-minimum:
    runs-on: ubuntu-latest

    # The oldest Statamic the addon supports. prefer-lowest never installs it:
    # Composer skips Statamic releases with security advisories.
    name: P8.3 - L12.* - Statamic 6.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, gd, exif
          coverage: none

      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer require "statamic/cms:6.0.0" "laravel/framework:12.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: composer test:unit
